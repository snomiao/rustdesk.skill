[package]
name = "rustdesk-skill"
version = "0.0.0"
edition = "2021"
description = "winrpc-style RustDesk web connect CLI for agents (rds): Playwright-driven RustDesk web + OCR positioned-text driver for ID connect, screenshot, click-by-text, type. Complements (not replaces) the official server-only rustdesk CLI."
license = "MIT"

[[bin]]
name = "rustdesk-skill"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# `access(2)`, to find a program as bun's lookup does. Only the C library
# that std links already.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
